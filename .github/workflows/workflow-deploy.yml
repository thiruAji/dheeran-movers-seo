name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract source bundle
        run: unzip -o dheeran-source-bundle.zip -d site-source
      - name: Install dependencies
        run: npm ci --prefix site-source
      - name: Build website
        run: npm run build --prefix site-source
        env:
          VITE_BASE_PATH: /dheeran-movers-seo/
          VITE_SITE_URL: https://thiruaji.github.io/dheeran-movers-seo
      - name: Verify prerendered routes
        run: npm run verify --prefix site-source
        env:
          VITE_SITE_URL: https://thiruaji.github.io/dheeran-movers-seo
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-source/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
